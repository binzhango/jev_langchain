[project]
name = "jev-langchain-lab"
version = "0.1.0"
description = "Compare an ordinary LangChain agent with Jev-assisted orchestration on the same task."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "langchain>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "langchain-typesafe>=0.0.1a3,<1",
  "langgraph-checkpoint-sqlite>=3,<4",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-dotenv>=1,<2",
]

[project.scripts]
jev-lab = "jev_harness.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
